    .claim { font: 400 13.5px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: var(--ink); fill-opacity: .82; }
    .stack { font: 500 11.5px ui-monospace, Consolas, monospace; fill: var(--signal); }
  </style>
  <rect x=".5" y=".5" width="459" height="149" rx="10" fill="var(--bg)" stroke="var(--line)"/>
  <text class="kind" x="22" y="32">3D PROJECT SPACE</text>
  <text class="name" x="20" y="64">Orbit</text>
  <text class="claim" x="22" y="92">Every project as a block on a blueprint;</text>
  <text class="claim" x="22" y="110">height is the number of tools it uses.</text>
  <text class="stack" x="22" y="134">React · three.js · React Three Fiber  →</text>
